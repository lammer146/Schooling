<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Расписание пар и звонков с таймером до звонка">
<title>Расписание</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --h:265;
  --bg:#07080f;--bg2:#10132a;
  --card:rgba(255,255,255,.06);--card-b:rgba(255,255,255,.11);
  --text:#eef0ff;--muted:#9aa1c9;
  --ltxt:74%;
  --ac:hsl(var(--h) 90% 68%);--ac2:hsl(calc(var(--h) + 50) 90% 62%);
  --r:22px;
  --shadow:0 12px 40px -14px rgba(0,0,0,.6);
}
[data-theme=light]{
  --bg:#f3f4fc;--bg2:#e6e9fb;
  --card:rgba(255,255,255,.72);--card-b:rgba(30,30,80,.09);
  --text:#161938;--muted:#5d6490;
  --ltxt:36%;
  --shadow:0 12px 36px -16px rgba(40,40,110,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
html[data-theme=light]{color-scheme:light}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2,h3,p{margin:0}

/* ---------- фон ---------- */
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg))}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;will-change:transform;transition:background 1s}
.b1{width:54vmax;height:54vmax;left:-16vmax;top:-14vmax;background:hsl(var(--h) 90% 55%);animation:f1 22s ease-in-out infinite alternate}
.b2{width:46vmax;height:46vmax;right:-14vmax;top:22vh;background:hsl(calc(var(--h) + 70) 90% 55%);animation:f2 27s ease-in-out infinite alternate}
.b3{width:42vmax;height:42vmax;left:8vw;bottom:-20vmax;background:hsl(calc(var(--h) - 60) 90% 50%);animation:f3 25s ease-in-out infinite alternate}
[data-theme=light] .blob{opacity:.33}
@keyframes f1{to{transform:translate(20vmax,14vmax) scale(1.2)}}
@keyframes f2{to{transform:translate(-18vmax,-12vmax) scale(1.15)}}
@keyframes f3{to{transform:translate(16vmax,-16vmax) scale(1.25)}}
#bg{position:absolute;inset:0;width:100%;height:100%}

/* ---------- каркас ---------- */
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding:calc(16px + env(safe-area-inset-top)) 16px calc(36px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.8px;
  background:linear-gradient(110deg,var(--text) 30%,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.now{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:10px}
.ibtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:18px;
  background:var(--card);border:1px solid var(--card-b);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .2s}
.ibtn:active{transform:scale(.9)}
.ibtn .dot{width:20px;height:20px;border-radius:50%;background:conic-gradient(var(--ac),var(--ac2),var(--ac));box-shadow:0 0 12px var(--ac)}

.cols{display:grid;gap:14px;grid-template-areas:"hero" "next" "sched" "bells"}
@media(min-width:980px){
  .wrap{max-width:1120px;padding:32px 36px 60px}
  .cols{grid-template-columns:430px 1fr;grid-template-areas:"hero sched" "next sched" "bells sched";grid-template-rows:auto auto 1fr;gap:20px 30px;align-items:start}
  .top h1{font-size:38px}
}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--r);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);box-shadow:var(--shadow)}

/* ---------- hero ---------- */
.hero{--sh:265;grid-area:hero;padding:20px;position:relative;overflow:hidden;transition:border-color .6s}
.hero::before{content:"";position:absolute;width:280px;height:280px;left:-70px;top:-90px;border-radius:50%;
  background:hsl(var(--sh) 90% 60%/.30);filter:blur(55px);animation:pulse 4.5s ease-in-out infinite;transition:background 1s}
.hero::after{content:"";position:absolute;width:200px;height:200px;right:-60px;bottom:-80px;border-radius:50%;
  background:hsl(calc(var(--sh) + 60) 90% 60%/.22);filter:blur(50px);transition:background 1s}
.hero>*{position:relative;z-index:1}
@keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
.hero-main{display:flex;gap:18px;align-items:center}
.ringbox{position:relative;width:128px;height:128px;flex:none}
.orbit{position:absolute;inset:-9px;border-radius:50%;border:1px dashed hsl(var(--sh) 80% 70%/.4);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{width:100%;height:100%;overflow:visible}
.ring-bg{fill:none;stroke:hsl(var(--sh) 40% 60%/.17);stroke-width:9}
.ring-fg{fill:none;stroke:url(#rg);stroke-width:9;stroke-linecap:round;stroke-dasharray:377;stroke-dashoffset:377;
  transition:stroke-dashoffset .9s linear;filter:drop-shadow(0 0 7px hsl(var(--sh) 95% 60%/.65))}
.ringc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#ringTime{font-weight:800;font-size:25px;font-variant-numeric:tabular-nums;letter-spacing:-.5px;line-height:1}
#ringTime.long{font-size:19px}
#ringLbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);max-width:76px;line-height:1.25;margin-top:5px;font-weight:600}
.hero-info{min-width:0;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.chip{display:inline-flex;gap:7px;align-items:center;padding:5px 11px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  background:hsl(var(--sh) 90% 60%/.16);color:hsl(var(--sh) 90% var(--ltxt));border:1px solid hsl(var(--sh) 90% 60%/.32)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25;transform:scale(.7)}}
.hero-info h2{font-size:19px;line-height:1.2;font-weight:800;letter-spacing:-.3px}
.hero-info p{font-size:13px;color:var(--muted);line-height:1.35}
.strip{margin-top:18px;padding-top:14px;border-top:1px solid var(--card-b);display:grid;gap:10px}
.strip[hidden]{display:none}
.srow{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:600}
.srow span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:700}
.dbar{height:7px;border-radius:9px;background:hsl(var(--sh) 40% 60%/.16);overflow:hidden}
.dbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,hsl(var(--sh) 90% 62%),hsl(calc(var(--sh) + 50) 90% 66%));transition:width 1s linear}

/* ---------- next ---------- */
.next{grid-area:next;padding:16px 18px;position:relative;overflow:hidden;--lh:265}
.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:hsl(var(--lh) 85% 62%)}
.nhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:6px}
.nl{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:hsl(var(--lh) 85% var(--ltxt))}
.nw{font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.next h3{font-size:16px;font-weight:800;line-height:1.25;margin-bottom:4px}
.next p{font-size:13px;color:var(--muted)}

/* ---------- расписание ---------- */
.sched{grid-area:sched;display:grid;gap:12px;align-content:start;min-width:0}
.weeknav{display:flex;align-items:center;gap:8px}
.nbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--card-b);font-size:18px;font-weight:800;transition:transform .2s}
.nbtn:active{transform:scale(.88)}
.wlabel{flex:1;text-align:center;line-height:1.15}
.wlabel b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.wlabel small{font-size:11.5px;color:var(--muted);font-weight:600}
.today-btn{padding:0 14px;height:38px;border-radius:12px;font-weight:700;font-size:13px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 8px 20px -8px var(--ac);transition:transform .2s}
.today-btn:active{transform:scale(.92)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;position:sticky;top:8px;z-index:6;padding:6px;border-radius:20px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border-radius:14px;position:relative;transition:background .25s,transform .2s,box-shadow .25s;color:var(--muted)}
.tab:active{transform:scale(.92)}
.tab .wd{font-weight:800;font-size:13px;color:var(--text)}
.tab .dt{font-size:10.5px;font-weight:600;font-variant-numeric:tabular-nums}
.tab.off .wd{opacity:.45}
.tab.today::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--ac);box-shadow:0 0 8px var(--ac)}
.tab.on{background:linear-gradient(145deg,var(--ac),var(--ac2));color:rgba(255,255,255,.85);box-shadow:0 10px 22px -8px var(--ac)}
.tab.on .wd{color:#fff}
.tab.on.today::after{background:#fff;box-shadow:none}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:2px 4px}
.dayhead b{font-size:18px;font-weight:800;letter-spacing:-.3px}
.dayhead span{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right}
.list{display:grid;gap:8px}
.lesson{--lh:265;display:grid;grid-template-columns:46px 1fr;gap:13px;padding:14px 14px 14px 16px;border-radius:18px;
  background:var(--card);border:1px solid var(--card-b);position:relative;overflow:hidden;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 70ms);
  transition:transform .35s,box-shadow .35s,border-color .35s,opacity .35s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}}
.lesson::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:hsl(var(--lh) 85% 62%)}
.num{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:21px;
  background:hsl(var(--lh) 85% 60%/.18);color:hsl(var(--lh) 90% var(--ltxt))}
.lb{min-width:0}
.lt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:5px}
.time{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;color:hsl(var(--lh) 85% var(--ltxt))}
.eta{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:hsl(var(--lh) 85% 60%/.2);color:hsl(var(--lh) 90% var(--ltxt))}
.badge.warn{background:rgba(251,191,36,.18);color:#d99a06}
.badge.st:empty{display:none}
.lesson h3{font-size:15px;font-weight:700;line-height:1.3}
.tch{font-size:13px;color:var(--muted);margin-top:4px}
.was{font-size:12px;color:#d99a06;margin-top:3px;font-weight:600}
.pbar{height:6px;border-radius:9px;background:hsl(var(--lh) 40% 60%/.2);margin-top:11px;overflow:hidden;display:none}
.pbar i{display:block;height:100%;width:0;border-radius:9px;transition:width 1s linear;position:relative;
  background:linear-gradient(90deg,hsl(var(--lh) 90% 58%),hsl(calc(var(--lh) + 40) 90% 66%))}
.pbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.lesson.cur{border-color:hsl(var(--lh) 90% 65%/.65);transform:scale(1.015);
  box-shadow:0 0 0 1px hsl(var(--lh) 90% 65%/.35),0 16px 40px -14px hsl(var(--lh) 90% 55%/.65)}
.lesson.cur .pbar{display:block}
.lesson.cur .num{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
.lesson.done{opacity:.48}
.lesson.next{border-style:dashed;border-color:hsl(var(--lh) 85% 65%/.55)}
.brk{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600;padding:0 6px;
  animation:rise .55s both;transition:color .3s}
.brk::before,.brk::after{content:"";flex:1;height:0;border-top:1px dashed var(--card-b)}
.brk.big{color:#d99a06}
.brk.win{color:var(--muted);font-style:italic}
.brk.now{color:var(--text)}
.brk.now span{padding:4px 12px;border-radius:99px;background:hsl(150 80% 50%/.18);animation:blink 1.8s infinite}
.brk.big.now span{background:hsl(38 95% 55%/.2)}
.empty{padding:34px 20px;text-align:center;display:grid;gap:8px;justify-items:center}
.empty .float{font-size:46px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(6deg)}}
.empty b{font-size:18px}.empty span{color:var(--muted);font-size:13.5px}

/* ---------- звонки ---------- */
.bells{grid-area:bells;padding:18px}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.bhead h2{font-size:18px;font-weight:800}
.seg{display:flex;padding:3px;border-radius:12px;background:hsl(var(--h) 30% 50%/.14)}
.seg button{padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.25s}
.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 14px -6px var(--ac)}
.brow{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid transparent;transition:.3s}
.bn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:hsl(var(--h) 80% 60%/.16);color:hsl(var(--h) 90% var(--ltxt))}
.bm b{display:block;font-size:15px;font-variant-numeric:tabular-nums;font-weight:800}
.bm small{color:var(--muted);font-size:12px;font-weight:600}
.beta{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.brow.cur{background:hsl(var(--h) 90% 60%/.13);border-color:hsl(var(--h) 90% 65%/.5);box-shadow:0 10px 26px -14px var(--ac)}
.brow.cur .beta{color:hsl(var(--h) 90% var(--ltxt))}
.brow.done{opacity:.45}
.bgap{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-weight:600;padding:3px 14px}
.bgap i{flex:1;border-top:1px dashed var(--card-b)}
.bgap.big{color:#d99a06;font-weight:800}
.bgap.now{color:var(--text)}

footer{margin-top:22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.conf{position:fixed;top:-30px;font-size:24px;z-index:50;pointer-events:none;animation:fall 3.4s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(600deg)}}

@media(max-width:360px){
  .hero-main{flex-direction:column;text-align:center}
  .hero-info{align-items:center}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <canvas id="bg"></canvas>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Расписание</h1>
      <div class="now" id="nowLine">&nbsp;</div>
    </div>
    <div class="tools">
      <button class="ibtn" id="btnAccent" aria-label="Сменить цвет"><span class="dot"></span></button>
      <button class="ibtn" id="btnTheme" aria-label="Светлая / тёмная тема">🌙</button>
    </div>
  </header>

  <main class="cols">
    <section class="card hero" id="hero">
      <div class="hero-main">
        <div class="ringbox">
          <div class="orbit"></div>
          <svg class="ring" viewBox="0 0 140 140" aria-hidden="true">
            <defs>
              <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" style="stop-color:hsl(var(--sh) 95% 70%)"/>
                <stop offset="1" style="stop-color:hsl(calc(var(--sh) + 55) 95% 62%)"/>
              </linearGradient>
            </defs>
            <circle class="ring-bg" cx="70" cy="70" r="60"/>
            <circle class="ring-fg" id="ringFg" cx="70" cy="70" r="60" transform="rotate(-90 70 70)"/>
          </svg>
          <div class="ringc"><div id="ringTime">--:--</div><div id="ringLbl"></div></div>
        </div>
        <div class="hero-info">
          <span class="chip"><i></i><span id="chip">Загрузка</span></span>
          <h2 id="hTitle"></h2>
          <p id="hTeacher"></p>
          <p id="hRange"></p>
        </div>
      </div>
      <div class="strip" id="strip">
        <div class="srow"><span id="sBell"></span><span id="sBellIn"></span></div>
        <div class="dbar"><i id="dFill"></i></div>
        <div class="srow"><span id="sDay"></span><span id="sHome"></span></div>
      </div>
    </section>

    <section class="card next" id="next"></section>

    <section class="sched">
      <div class="weeknav">
        <button class="nbtn" id="prevW" aria-label="Предыдущая неделя">‹</button>
        <div class="wlabel"><b id="wRange"></b><small id="wTag"></small></div>
        <button class="today-btn" id="btnToday">Сегодня</button>
        <button class="nbtn" id="nextW" aria-label="Следующая неделя">›</button>
      </div>
      <div class="card tabs" id="tabs"></div>
      <div class="dayhead" id="dayHead"></div>
      <div class="list" id="list"></div>
    </section>

    <section class="card bells">
      <div class="bhead">
        <h2>🔔 Расписание звонков</h2>
        <div class="seg" id="seg">
          <button data-m="mon">Пн</button>
          <button data-m="std">Вт–Пт</button>
        </div>
      </div>
      <div id="bellList"></div>
    </section>
  </main>

  <footer>
    Свайпай влево / вправо — смена дня · на ПК работают стрелки ← →<br>
    🎨 меняет цвет, 🌙 — тему
  </footer>
</div>

<script>
(()=>{
'use strict';

/* =====================================================
   ДАННЫЕ — редактируются здесь
   ===================================================== */
const SUBJ={
  toib:{name:'Технология обеспечения информационной безопасности систем радиосвязи, мобильной связи и …',short:'Информационная безопасность радиосвязи',teacher:'Сапрыкин Сергей Юрьевич',hue:262},
  mgmt:{name:'Современные технологии управления структурным подразделением организации',short:'Технологии управления подразделением',teacher:'Елисеева Ксения Владимировна',hue:332},
  conv:{name:'Теоретические основы конвергенции логических, интеллектуальных сетей и инфокоммуникационных технологий',short:'Конвергенция сетей и ИКТ',teacher:'Мартыненко Николай Валерьевич',hue:200},
  power:{name:'Энергоснабжение телекоммуникационных систем',short:'Энергоснабжение телеком. систем',teacher:'Кравченко Ирина Федоровна',hue:42},
  plan:{name:'Планирование и организация работы структурного подразделения',short:'Планирование работы подразделения',teacher:'Пазовская Антонина Вильевна',hue:150},
  eng:{name:'Иностранный язык в профессиональной деятельности',short:'Иностранный язык',teacher:'Ковалёва (Зубкова) Надежда Сергеевна',hue:14},
  pe:{name:'Физическая культура',short:'Физкультура',teacher:'Бочков Константин Евгеньевич',hue:100},
  safety:{name:'Охрана труда',short:'Охрана труда',teacher:'Кирейшина Алла Анатольевна',hue:176}
};
// Базовое расписание недели: индекс 0 = понедельник; внутри — пары 1..4
const WEEK={
  0:['toib','toib','mgmt','mgmt'],
  1:['toib','toib','conv','conv'],
  2:['power','power','plan','plan'],
  3:['eng','plan','pe','conv'],
  4:['safety','safety']          // на скрине пятница обрезана — добавь остальные пары сюда
};
// Разовые замены: 'ГГГГ-ММ-ДД': {номер_пары:'предмет'}
const OVERRIDES={
  '2026-10-06':{1:'pe'}          // вторник: 1 пара ↔ физкультура
};
// Звонки
const BELLS={
  mon:{talk:['09:00','09:45'],pairs:[['09:50','11:20'],['11:30','13:00'],['13:30','15:00'],['15:10','16:40']]},
  std:{pairs:[['09:00','10:20'],['10:30','11:50'],['12:20','13:40'],['13:50','15:10']]}
};

/* =====================================================
   Утилиты
   ===================================================== */
const DOW_SHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const DOW_FULL=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}`;
const dowOf=d=>(d.getDay()+6)%7;
const startOfDay=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const tm=s=>{const [a,b]=s.split(':');return +a*60+ +b;};
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const store=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}};

function human(sec){
  sec=Math.max(0,Math.round(sec));
  if(sec<60)return sec+' сек';
  const t=Math.ceil(sec/60),d=Math.floor(t/1440),h=Math.floor((t%1440)/60),m=t%60;
  if(d>0)return `${d} д ${h} ч`;
  if(h>0)return m?`${h} ч ${m} мин`:`${h} ч`;
  return `${m} мин`;
}
function cd(sec){
  sec=Math.max(0,Math.round(sec));
  if(sec>=86400){const d=Math.floor(sec/86400),h=Math.floor((sec%86400)/3600);return `${d} д ${pad(h)} ч`;}
  const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h>0?`${h}:${pad(m)}:${pad(s)}`:`${pad(m)}:${pad(s)}`;
}

/* =====================================================
   Модель дня
   ===================================================== */
function dayItems(date){
  const dow=dowOf(date);
  if(dow>4)return [];
  const b=dow===0?BELLS.mon:BELLS.std;
  const items=[];
  if(b.talk)items.push({kind:'talk',n:0,s:tm(b.talk[0]),e:tm(b.talk[1]),name:'Классный час',short:'Классный час',teacher:'',hue:300});
  const base=WEEK[dow]||[];
  const ov=OVERRIDES[key(date)]||{};
  b.pairs.forEach((p,i)=>{
    const swapped=ov[i+1]!==undefined;
    const code=swapped?ov[i+1]:base[i];
    if(!code)return;
    const sj=SUBJ[code];
    items.push({kind:'pair',n:i+1,s:tm(p[0]),e:tm(p[1]),name:sj.name,short:sj.short,teacher:sj.teacher,hue:sj.hue,
      swap:swapped,was:swapped&&base[i]?SUBJ[base[i]].short:''});
  });
  return items;
}
function nextWork(now){
  const t=startOfDay(now);
  for(let i=1;i<=14;i++){
    const d=addDays(t,i),it=dayItems(d);
    if(it.length){
      const tgt=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()+it[0].s*60000;
      return {date:d,first:it[0],inSec:(tgt-now.getTime())/1000,days:i};
    }
  }
  return null;
}
function getState(now){
  const today=startOfDay(now);
  const sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
  const items=dayItems(today);
  const st={sec,items,today};
  if(!items.length){st.type='off';st.weekend=dowOf(today)>4;st.frac=1;st.nx=nextWork(now);return st;}
  const first=items[0],last=items[items.length-1];
  st.first=first;st.last=last;
  st.dayFrac=clamp((sec-first.s*60)/((last.e-first.s)*60),0,1);
  if(sec<first.s*60){
    st.type='before';st.rem=first.s*60-sec;st.frac=1-Math.min(st.rem,3600)/3600;st.up=first;return st;
  }
  for(let i=0;i<items.length;i++){
    const it=items[i];
    if(sec>=it.s*60&&sec<it.e*60){
      st.type='lesson';st.cur=it;st.curIdx=i;st.rem=it.e*60-sec;st.frac=(sec-it.s*60)/((it.e-it.s)*60);st.up=items[i+1]||null;return st;
    }
    const nx=items[i+1];
    if(nx&&sec>=it.e*60&&sec<nx.s*60){
      const gap=nx.s-it.e;
      st.type=(nx.n-it.n>1&&it.kind==='pair')?'window':(gap>=25?'bigbreak':'break');
      st.gap=gap;st.prev=it;st.up=nx;st.rem=nx.s*60-sec;st.frac=(sec-it.e*60)/(gap*60);return st;
    }
  }
  st.type='done';st.frac=1;st.nx=nextWork(now);return st;
}

/* =====================================================
   Состояние интерфейса
   ===================================================== */
const sel={offset:0,dow:0};
let bellMode='std';
let lastKey='',prevType=null;

function initSel(){
  const now=new Date(),d=dowOf(now);
  sel.offset=0;sel.dow=d;
  if(d>=5){sel.offset=1;sel.dow=0;}
  bellMode=sel.dow===0?'mon':'std';
}
function weekMonday(){
  const now=new Date();
  return addDays(addDays(startOfDay(now),-dowOf(now)),sel.offset*7);
}
const selDate=()=>addDays(weekMonday(),sel.dow);

/* ---------- вкладки недели ---------- */
function renderTabs(){
  const mon=weekMonday(),todayK=key(new Date());
  $('tabs').innerHTML=[...Array(7)].map((_,i)=>{
    const d=addDays(mon,i),has=dayItems(d).length>0;
    const cls=['tab',i===sel.dow?'on':'',key(d)===todayK?'today':'',has?'':'off'].join(' ');
    return `<button class="${cls}" data-i="${i}"><span class="wd">${DOW_SHORT[i]}</span><span class="dt">${fmt(d)}</span></button>`;
  }).join('');
  $('wRange').textContent=`${fmt(mon)} – ${fmt(addDays(mon,6))}`;
  $('wTag').textContent=sel.offset===0?'Эта неделя':sel.offset===1?'Следующая неделя':sel.offset===-1?'Прошлая неделя':(sel.offset>0?`+${sel.offset} нед.`:`${sel.offset} нед.`);
}

/* ---------- список пар ---------- */
function lessonHTML(it,i){
  return `<article class="lesson" style="--lh:${it.hue};--i:${i}" data-s="${it.s}" data-e="${it.e}">
    <div class="num">${it.kind==='talk'?'💬':it.n}</div>
    <div class="lb">
      <div class="lt"><span class="time">${hm(it.s)}–${hm(it.e)}</span>${it.swap?'<span class="badge warn">↔ замена</span>':''}<span class="badge st"></span><span class="eta" data-eta></span></div>
      <h3>${it.name}</h3>
      ${it.teacher?`<p class="tch">👤 ${it.teacher}</p>`:''}
      ${it.was?`<p class="was">вместо: ${it.was}</p>`:''}
      <div class="pbar"><i></i></div>
    </div>
  </article>`;
}
function plural(n,a,b,c){const m=n%10,k=n%100;return k>10&&k<15?c:m===1?a:(m>1&&m<5?b:c);}
function renderList(){
  const d=selDate(),items=dayItems(d);
  const pairs=items.filter(i=>i.kind==='pair');
  $('dayHead').innerHTML=`<b>${DOW_FULL[sel.dow]}, ${d.getDate()} ${MON[d.getMonth()]}</b><span>${
    items.length?`${pairs.length} ${plural(pairs.length,'пара','пары','пар')} · ${hm(items[0].s)}–${hm(items[items.length-1].e)}`:'выходной'}</span>`;
  if(!items.length){
    $('list').innerHTML=`<div class="card empty"><div class="float">🌴</div><b>Пар нет</b><span>Можно выдохнуть и заняться своими делами</span></div>`;
    return;
  }
  let html='';
  items.forEach((it,i)=>{
    if(i>0){
      const p=items[i-1],gap=it.s-p.e,win=it.n-p.n>1&&p.kind==='pair',big=gap>=25;
      html+=`<div class="brk ${big?'big':''} ${win?'win':''}" data-s="${p.e}" data-e="${it.s}"><span>${win?'🪟 окно':big?'🍜 обед / большая перемена':'перемена'} · ${gap} мин · ${hm(p.e)}–${hm(it.s)}</span></div>`;
    }
    html+=lessonHTML(it,i);
  });
  $('list').innerHTML=html;
}

/* ---------- звонки ---------- */
function renderBells(){
  const b=BELLS[bellMode],rows=[];
  if(b.talk)rows.push({n:'💬',label:'Классный час',s:tm(b.talk[0]),e:tm(b.talk[1])});
  b.pairs.forEach((p,i)=>rows.push({n:i+1,label:`${i+1} пара`,s:tm(p[0]),e:tm(p[1])}));
  let h='';
  rows.forEach((r,i)=>{
    if(i){const g=r.s-rows[i-1].e;
      h+=`<div class="bgap ${g>=25?'big':''}" data-s="${rows[i-1].e}" data-e="${r.s}"><i></i><span>${g>=25?'🍜 обед / большая перемена':'перемена'} ${g} мин</span><i></i></div>`;}
    h+=`<div class="brow" data-s="${r.s}" data-e="${r.e}"><span class="bn">${r.n}</span><div class="bm"><b>${hm(r.s)} – ${hm(r.e)}</b><small>${r.label} · ${r.e-r.s} мин</small></div><span class="beta"></span></div>`;
  });
  $('bellList').innerHTML=h;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===bellMode));
}

/* ---------- hero ---------- */
function dayLabel(nx){return nx.days===1?'Завтра':`${DOW_SHORT[dowOf(nx.date)]}, ${fmt(nx.date)}`;}
function nextHTML(st){
  let head,it,when;
  if(st.type==='lesson'){
    if(st.up){it=st.up;head='Далее';when='через '+human(st.up.s*60-st.sec);}
    else return `<div class="nhead"><span class="nl" style="--lh:150">Последняя пара</span><span class="nw">🏠 домой в ${hm(st.last.e)}</span></div><h3>Это последняя пара на сегодня</h3><p>Осталось ${human(st.rem)} — и свобода 🎉</p>`;
  }else if(st.up){it=st.up;head=st.type==='before'?'Первая':'Следом';when='через '+human(st.rem);}
  else if(st.nx){it=st.nx.first;head='Ближайшие занятия';when=`${dayLabel(st.nx)} в ${hm(it.s)}`;}
  else return `<h3>Занятий пока нет</h3>`;
  return `<div class="nhead"><span class="nl">${head}${it.kind==='pair'?' · пара '+it.n:''}</span><span class="nw">${when}</span></div>
    <h3>${it.short}</h3><p>${it.teacher?'👤 '+it.teacher+' · ':''}🕘 ${hm(it.s)}–${hm(it.e)}</p>`;
}
function renderHero(st){
  const hero=$('hero');
  let chip,title,teacher='',range='',lbl='',hue=265,time='',strip=true;
  switch(st.type){
    case 'lesson':{
      const c=st.cur;hue=c.hue;
      chip=c.kind==='talk'?'Идёт классный час':`Идёт пара ${c.n}`;
      title=c.short;teacher=c.teacher?'👤 '+c.teacher:'';range=`🕘 ${hm(c.s)}–${hm(c.e)}`;
      lbl=c.kind==='talk'?'до конца':'до звонка с пары';time=cd(st.rem);break;}
    case 'before':{
      hue=210;chip='Скоро начало';title=st.up.short;teacher=st.up.teacher?'👤 '+st.up.teacher:'';
      range=`🕘 начало в ${hm(st.up.s)}`;lbl='до звонка на '+(st.up.kind==='talk'?'классный час':'1 пару');time=cd(st.rem);break;}
    case 'break':{
      hue=165;chip='Перемена · '+st.gap+' мин';title='Передохни 😌';
      teacher=`Дальше: ${st.up.short}`;range=st.up.teacher?'👤 '+st.up.teacher:'';
      lbl='до звонка на пару';time=cd(st.rem);break;}
    case 'bigbreak':{
      hue=38;chip='Большая перемена';title='Время поесть 🍜';
      teacher=`Дальше: ${st.up.short}`;range=st.up.teacher?'👤 '+st.up.teacher:'';
      lbl='до звонка на пару';time=cd(st.rem);break;}
    case 'window':{
      hue=15;chip='Окно';title='Свободное время 🪟';teacher=`Дальше: ${st.up.short}`;range=`🕘 в ${hm(st.up.s)}`;
      lbl='до звонка на пару';time=cd(st.rem);break;}
    case 'done':{
      hue=285;chip='Пары закончились';title='Свободен! 🎉';
      teacher=st.nx?`Дальше: ${dayLabel(st.nx)} в ${hm(st.nx.first.s)}`:'';
      lbl='до следующих занятий';time=st.nx?cd(st.nx.inSec):'✓';strip=false;break;}
    default:{
      hue=285;chip=st.weekend?'Выходной':'Пар нет';title='Отдыхай 🌴';
      teacher=st.nx?`Дальше: ${dayLabel(st.nx)} в ${hm(st.nx.first.s)}`:'';
      lbl='до начала занятий';time=st.nx?cd(st.nx.inSec):'';strip=false;}
  }
  hero.style.setProperty('--sh',hue);
  $('chip').textContent=chip;$('hTitle').textContent=title;$('hTeacher').textContent=teacher;$('hRange').textContent=range;
  const rt=$('ringTime');rt.textContent=time;rt.classList.toggle('long',time.length>5);
  $('ringLbl').textContent=lbl;
  $('ringFg').style.strokeDashoffset=(377*(1-clamp(st.frac??1,0,1))).toFixed(1);
  const sp=$('strip');sp.hidden=!strip;
  if(strip){
    const up=st.type==='lesson'?null:st.up;
    if(st.type==='lesson'){
      $('sBell').textContent='🔔 Звонок с '+(st.cur.kind==='talk'?'классного часа':'пары')+' в '+hm(st.cur.e);
      $('sBellIn').textContent='через '+human(st.rem);
    }else{
      $('sBell').textContent='🔔 Звонок на '+(up.kind==='talk'?'классный час':'пару '+up.n)+' в '+hm(up.s);
      $('sBellIn').textContent='через '+human(st.rem);
    }
    $('dFill').style.width=(st.dayFrac*100).toFixed(1)+'%';
    $('sDay').textContent=`🏁 День прошёл на ${Math.round(st.dayFrac*100)}%`;
    $('sHome').textContent=`домой в ${hm(st.last.e)} · ${human(st.last.e*60-st.sec)}`;
  }
  const nx=$('next');
  nx.innerHTML=nextHTML(st);
  const nh=(st.type==='lesson'?(st.up?st.up.hue:150):st.up?st.up.hue:(st.nx?st.nx.first.hue:265));
  nx.style.setProperty('--lh',nh);
  document.title=(time?time+' · ':'')+'Расписание';
}

/* ---------- динамика списков ---------- */
function updateDynamic(now,st){
  const sec=st.sec,isToday=key(selDate())===key(now);
  const nextStart=st.items.find(it=>it.s*60>sec);
  document.querySelectorAll('#list .lesson').forEach(el=>{
    const stb=el.querySelector('.st'),eta=el.querySelector('[data-eta]');
    if(!isToday){el.classList.remove('done','cur','next');stb.textContent='';eta.textContent='';return;}
    const s=+el.dataset.s*60,e=+el.dataset.e*60;
    const cur=sec>=s&&sec<e,done=sec>=e,nxt=!cur&&!done&&nextStart&&+el.dataset.s===nextStart.s;
    el.classList.toggle('cur',cur);el.classList.toggle('done',done);el.classList.toggle('next',!!nxt);
    stb.textContent=cur?'Идёт сейчас':nxt?'Далее':'';
    eta.textContent=cur?'осталось '+human(e-sec):done?'прошла ✓':'через '+human(s-sec);
    if(cur)el.querySelector('.pbar i').style.width=((sec-s)/(e-s)*100).toFixed(1)+'%';
  });
  document.querySelectorAll('#list .brk').forEach(el=>{
    el.classList.toggle('now',isToday&&sec>=+el.dataset.s*60&&sec<+el.dataset.e*60);
  });
  const todayMode=dowOf(now)===0?'mon':(dowOf(now)<5?'std':null);
  const live=todayMode===bellMode;
  document.querySelectorAll('#bellList .brow').forEach(el=>{
    const eta=el.querySelector('.beta');
    if(!live){el.classList.remove('cur','done');eta.textContent='';return;}
    const s=+el.dataset.s*60,e=+el.dataset.e*60;
    const cur=sec>=s&&sec<e,done=sec>=e;
    el.classList.toggle('cur',cur);el.classList.toggle('done',done);
    eta.textContent=cur?'идёт · '+human(e-sec):done?'✓':'через '+human(s-sec);
  });
  document.querySelectorAll('#bellList .bgap').forEach(el=>{
    el.classList.toggle('now',live&&sec>=+el.dataset.s*60&&sec<+el.dataset.e*60);
  });
}

/* ---------- конфетти ---------- */
function confetti(){
  const em=['🎉','✨','🎊','⭐','🥳'];
  for(let i=0;i<26;i++){
    const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.9)+'s';
    s.style.fontSize=(18+Math.random()*16)+'px';
    document.body.appendChild(s);setTimeout(()=>s.remove(),4800);
  }
}

/* ---------- тик ---------- */
function tick(){
  const now=new Date(),st=getState(now);
  $('nowLine').textContent=`${DOW_FULL[dowOf(now)]}, ${now.getDate()} ${MON[now.getMonth()]} · ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  if(key(now)!==lastKey){
    if(lastKey){initSel();}
    lastKey=key(now);renderTabs();renderList();renderBells();
  }
  renderHero(st);
  updateDynamic(now,st);
  if(prevType&&prevType!=='done'&&st.type==='done')confetti();
  prevType=st.type;
}

/* =====================================================
   Управление
   ===================================================== */
function vib(){try{navigator.vibrate&&navigator.vibrate(8);}catch(e){}}
function setDay(dow,offset){
  sel.dow=dow;if(offset!==undefined)sel.offset=offset;
  if(dow===0)bellMode='mon';else if(dow<5)bellMode='std';
  renderTabs();renderList();renderBells();tick();
}
function stepDay(dir){
  let d=sel.dow+dir,o=sel.offset;
  if(d>6){d=0;o++;}else if(d<0){d=6;o--;}
  setDay(d,o);vib();
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){setDay(+b.dataset.i);vib();}});
$('prevW').addEventListener('click',()=>{setDay(sel.dow,sel.offset-1);vib();});
$('nextW').addEventListener('click',()=>{setDay(sel.dow,sel.offset+1);vib();});
$('btnToday').addEventListener('click',()=>{initSel();renderTabs();renderList();renderBells();tick();vib();});
$('seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b){bellMode=b.dataset.m;renderBells();tick();}});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')stepDay(-1);else if(e.key==='ArrowRight')stepDay(1);
});
let tx=0,ty=0;
const swipeEl=document.querySelector('.sched');
swipeEl.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
swipeEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60&&Math.abs(dy)<45)stepDay(dx<0?1:-1);
},{passive:true});

/* ---------- тема и акцент ---------- */
const HUES=[265,200,330,150,35];
let hueIdx=0,theme='dark';
function applyLook(){
  document.documentElement.dataset.theme=theme;
  document.documentElement.style.setProperty('--h',HUES[hueIdx]);
  $('btnTheme').textContent=theme==='dark'?'🌙':'☀️';
  document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#07080f':'#f3f4fc';
}
(()=>{
  const t=store('sch-theme'),h=+store('sch-hue');
  if(t==='light'||t==='dark')theme=t;
  if(HUES.includes(h))hueIdx=HUES.indexOf(h);
  applyLook();
})();
$('btnTheme').addEventListener('click',()=>{theme=theme==='dark'?'light':'dark';store('sch-theme',theme);applyLook();vib();});
$('btnAccent').addEventListener('click',()=>{hueIdx=(hueIdx+1)%HUES.length;store('sch-hue',HUES[hueIdx]);applyLook();vib();});

/* ---------- анимированный фон-частицы ---------- */
(()=>{
  const cv=$('bg'),ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,P=[];
  function resize(){
    const dpr=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.round(clamp(W*H/17000,26,80));
    P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.28,vy:(Math.random()-.5)*.28,r:Math.random()*1.7+.5,p:Math.random()*6}));
  }
  function frame(t){
    ctx.clearRect(0,0,W,H);
    const light=theme==='light',hue=HUES[hueIdx],L=light?38:78;
    for(const a of P){
      a.x+=a.vx;a.y+=a.vy;
      if(a.x<-10)a.x=W+10;else if(a.x>W+10)a.x=-10;
      if(a.y<-10)a.y=H+10;else if(a.y>H+10)a.y=-10;
      const tw=.45+.4*Math.sin(t/900+a.p);
      ctx.fillStyle=`hsla(${hue},90%,${L}%,${tw})`;
      ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,6.283);ctx.fill();
    }
    ctx.lineWidth=1;
    for(let i=0;i<P.length;i++){
      for(let j=i+1;j<P.length;j++){
        const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d=dx*dx+dy*dy;
        if(d<11000){
          ctx.strokeStyle=`hsla(${hue},90%,${L}%,${(1-d/11000)*.22})`;
          ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke();
        }
      }
    }
    if(!reduce)requestAnimationFrame(frame);
  }
  resize();addEventListener('resize',resize);
  requestAnimationFrame(frame);
})();

/* ---------- старт ---------- */
initSel();
tick();
setInterval(tick,1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
})();
</script>
